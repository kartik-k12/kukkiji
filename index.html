<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sugandha 💖</title>

<style>
* { box-sizing: border-box; font-family: 'Comic Sans MS', cursive; }

body {
  margin: 0;
  background: radial-gradient(circle at top, #1a001a, black);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
  color: white;
}

/* Floating background hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-900px); opacity: 0; }
}

/* Main container */
.container {
  background: rgba(255, 192, 203, 0.08);
  backdrop-filter: blur(10px);
  width: 90%;
  max-width: 700px;
  border-radius: 25px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 0 40px rgba(255, 105, 180, 0.5);
  z-index: 2;
}

h1, h2 { color: #ff4da6; text-shadow: 0 0 20px #ff4da6; }

button {
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
  margin: 10px;
}

.yes { background: #ff4da6; color: white; }
.no { background: #444; color: white; }

button:hover { transform: scale(1.1); }

.hidden { display: none; }

/* Gifts */
.gifts {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.gift {
  background: #ff4da6;
  padding: 20px;
  border-radius: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.gift:hover { transform: scale(1.1); }

/* Heart burst animation */
.burst {
  position: absolute;
  font-size: 22px;
  animation: burstAnim 1s forwards;
}

@keyframes burstAnim {
  to {
    transform: translateY(-150px) scale(1.5);
    opacity: 0;
  }
}

/* Final text glow */
#step3 p {
  line-height: 1.7;
  margin-top: 15px;
  font-size: 16px;
  text-shadow: 0 0 8px rgba(255, 77, 166, 0.6);
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="hearts-container"></div>

<!-- STEP 1 -->
<div class="container" id="step1">
  <h1>Hey Madam Ji 💌</h1>
  <h2>Will you be my Valentine Sugandha?</h2>

  <button class="yes" onclick="yesClicked()">YES 💖</button>
  <button class="no" id="noBtn">NO</button>
</div>

<!-- STEP 2 -->
<div class="container hidden" id="step2">
  <h1>You said YES 😌💖</h1>
  <p>Choose your gift 🎁</p>

  <div class="gifts">
    <div class="gift" onclick="openGift(1)">Gift 1</div>
    <div class="gift" onclick="openGift(2)">Gift 2</div>
    <div class="gift" onclick="openGift(3)">Gift 3</div>
  </div>

  <div id="giftMsg" style="margin-top:20px;"></div>
</div>

<!-- STEP 3 -->
<div class="container hidden" id="step3">
  <h1>Forever Yours ❤️</h1>
  <p id="loveMessage"></p>
</div>

<script>

let noScale = 1;
const noBtn = document.getElementById("noBtn");

// NO button shrinks
noBtn.addEventListener("click", () => {
  noScale -= 0.1;
  if(noScale > 0.3){
    noBtn.style.transform = "scale(" + noScale + ")";
  }
});

// YES button
function yesClicked() {
  document.getElementById("music").play();
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// Gift logic
function openGift(num) {
  const msg = document.getElementById("giftMsg");

  if(num === 1){
    msg.innerHTML = "💖 You are my favorite person";
    heartBurst();
  }
  else if(num === 2){
    msg.innerHTML = "💞 I choose you every day";
    heartBurst();
  }
  else if(num === 3){
    msg.innerHTML = "";
    setTimeout(() => {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
      typeMessage();
    }, 800);
  }
}

// Heart burst
function heartBurst(){
  for(let i=0;i<15;i++){
    const heart = document.createElement("div");
    heart.className = "burst";
    heart.innerHTML = "❤️";
    heart.style.left = (window.innerWidth/2 + Math.random()*100-50) + "px";
    heart.style.top = (window.innerHeight/2) + "px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),1000);
  }
}

// Floating background hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.fontSize = 14 + Math.random() * 20 + "px";
  heart.style.animationDuration = 4 + Math.random() * 2 + "s";
  heart.innerHTML = "💗";
  document.getElementById("hearts-container").appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,300);

// Typing animation
const fullText = `Sugandha, it’s been 1.3 years with you, and honestly, it still feels special every single day.

Since 12 November 2024, my life has changed in the best way because of you.

You’re not just beautiful, you’re so caring and kind, and the way you love me makes me feel really lucky.

The way you understand my mood, support me, and stay with me even when I’m not at my best means everything to me.

Talking to you makes my day better, and your smile is still my favorite thing.

Being with you feels natural and safe, like home.

I’m really thankful that you’re in my life, and I promise I’ll always respect you, stand by you, and try my best to make you as happy as you make me.

I love you, Sugandha ❤️`;

let index = 0;

function typeMessage() {
  if (index < fullText.length) {
    document.getElementById("loveMessage").innerHTML += fullText.charAt(index);
    index++;
    setTimeout(typeMessage, 35);
  }
}

</script>

</body>
</html>
