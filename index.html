<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
* {
  box-sizing: border-box;
  font-family: 'Comic Sans MS', cursive;
}

body {
  margin: 0;
  background: linear-gradient(135deg, #ffd6e8, #ffeef6);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}

.container {
  background: #ffe0ec;
  width: 95%;
  max-width: 800px;
  border-radius: 25px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

h1, h2 {
  color: #d6336c;
}

.btns {
  margin-top: 30px;
  position: relative;
  height: 120px;
}

button {
  padding: 15px 30px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

.yes {
  background: #ff5c8a;
  color: white;
}

.no {
  background: #ffc2d1;
  position: absolute;
}

button:hover {
  transform: scale(1.1);
}

.hidden {
  display: none;
}

.gifts {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.gift {
  background: #ff8fab;
  padding: 25px;
  border-radius: 20px;
  width: 120px;
  cursor: pointer;
  animation: bounce 2s infinite;
}

.message {
  margin-top: 20px;
  font-size: 20px;
  color: #c9184a;
}

.rose {
  font-size: 90px;
  animation: float 3s infinite;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1;}
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-10px);}
}

@keyframes float {
  0% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
  100% {transform: translateY(0);}
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container" id="step1">
  <h1>💌 Hey there madam jii!</h1>
  <h2>Will you be my Valentine Sugandha?</h2>

  <div class="btns">
    <button class="yes" onclick="yesClicked()">YES OF COURSE 💖</button>
    <button class="no" id="noBtn">NO THANK YOU</button>
  </div>
</div>

<div class="container hidden" id="step2">
  <h1>Yay! You said yes! 💕</h1>
  <p>I made these gifts for you 🎁</p>

  <div class="gifts">
    <div class="gift" onclick="openGift(1)">Gift 1</div>
    <div class="gift" onclick="openGift(2)">Gift 2</div>
    <div class="gift" onclick="openGift(3)">Gift 3</div>
  </div>

  <div class="message" id="giftMsg"></div>
</div>

<div class="container hidden" id="step3">
  <div class="rose">🌹</div>
  <h1>Forever Yours ❤️</h1>
  <p>You are the best part of my life</p>
  <p>I will always love you</p>
  <p>I can’t imagine life without you chotuuu</p>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("click", moveNo);

function moveNo() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 80 - 40;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function yesClicked() {
  document.getElementById("music").play();
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

function openGift(num) {
  const msg = document.getElementById("giftMsg");
  const messages = {
    1: "💖 You are my favorite person",
    2: "💞 I choose you every day",
    3: "❤️ You will forever be my only option"
    4: "❤️ best decision of my life on- 12nov2024"
  };
  msg.innerText = messages[num];

  if (num === 3) {
    setTimeout(() => {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
    }, 1500);
  }
}
</script>

</body>
</html>
