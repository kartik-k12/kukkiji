<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
* { box-sizing: border-box; font-family: 'Comic Sans MS', cursive; }

body {
  margin: 0;
  background: linear-gradient(135deg, #ffd6e8, #ffeef6);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* Floating background hearts */
#hearts-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

.container {
  background: #ffe0ec;
  width: 95%;
  max-width: 800px;
  border-radius: 25px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
  z-index: 2;
  position: relative;
}

h1,h2 { color: #d6336c; }

.btns {
  margin-top: 30px;
  position: relative;
  height: 120px;
}

button {
  padding: 15px 30px;
  border-radius: 30px;
  border: none;
  font-size: 18px;
  cursor: pointer;
  transition: 0.2s;
}

.yes { background: #ff5c8a; color: white; }
.no { background: #ffc2d1; position: absolute; }

button:hover { transform: scale(1.1); }

.hidden { display: none; }

.gifts {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.gift {
  background: #ff8fab;
  padding: 25px;
  border-radius: 20px;
  width: 120px;
  cursor: pointer;
}

.message { margin-top: 20px; font-size: 20px; color: #c9184a; }

.finalText {
  font-size: 20px;
  margin-top: 15px;
  color: #c9184a;
}

.photo {
  margin-top: 20px;
  max-width: 280px;
  width: 90%;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 1.5s ease;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="hearts-container"></div>

<!-- STEP 1 -->
<div class="container" id="step1">
  <h1>💌 Hey there madam jii!</h1>
  <h2>Will you be my Valentine Sugandha?</h2>

  <div class="btns">
    <button class="yes" onclick="yesClicked()">YES OF COURSE 💖</button>
    <button class="no" id="noBtn">NO THANK YOU</button>
  </div>
</div>

<!-- STEP 2 -->
<div class="container hidden" id="step2">
  <h1>Yay! You said yes! 💕</h1>
  <p>I made these gifts for you 🎁</p>

  <div class="gifts">
    <div class="gift" onclick="openGift(1)">Gift 1</div>
    <div class="gift" onclick="openGift(2)">Gift 2</div>
    <div class="gift" onclick="openGift(3)">Gift 3</div>
  </div>

  <div class="message" id="giftMsg"></div>
</div>

<!-- STEP 3 -->
<div class="container hidden" id="step3">
  <h1>Forever Yours ❤️</h1>
  <div class="finalText" id="finalMessage"></div>
  <img src="photo.jpg" class="photo" id="finalPhoto">
</div>

<script>

/* NO button shrinks every time */
let noScale = 1;
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseenter", function() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 80 - 40;
  noScale -= 0.1;
  if (noScale < 0.3) noScale = 0.3;
  noBtn.style.transform = `translate(${x}px, ${y}px) scale(${noScale})`;
});

/* YES button */
function yesClicked() {
  document.getElementById("music").play();
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

/* Gift logic */
function openGift(num) {
  const msg = document.getElementById("giftMsg");

  if (num === 1 || num === 2) {
    msg.innerText = num === 1 
      ? "💖 You are my favorite person"
      : "💞 I choose you every day";
    heartBurst();
  }

  if (num === 3) {
    msg.innerText = "❤️ Opening your final surprise...";
    setTimeout(() => {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
      typeMessage("You are the best part of my life. Life feels brighter with you in it. I will always choose you. 💕");
    }, 1500);
  }
}

/* Typing effect + show photo */
function typeMessage(text) {
  const el = document.getElementById("finalMessage");
  const photo = document.getElementById("finalPhoto");
  el.innerHTML = "";
  let i = 0;

  function typing() {
    if (i < text.length) {
      el.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 40);
    } else {
      photo.style.opacity = "1";
    }
  }
  typing();
}

/* Floating background hearts */
const heartsContainer = document.getElementById("hearts-container");

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "-20px";
  heart.style.fontSize = (16 + Math.random() * 20) + "px";
  heart.style.animationDuration = (4 + Math.random() * 3) + "s";
  heartsContainer.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 300);

/* Heart burst animation */
function heartBurst() {
  for (let i = 0; i < 25; i++) {
    const heart = document.createElement("div");
    heart.innerHTML = "💖";
    heart.style.position = "absolute";
    heart.style.left = "50%";
    heart.style.top = "50%";
    heart.style.fontSize = "20px";
    heart.style.transform = `translate(${Math.random()*300-150}px, ${Math.random()*300-150}px)`;
    heart.style.animation = "floatUp 2s forwards";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
}

</script>

</body>
</html>
